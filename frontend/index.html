<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Management</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>
            Student Management System
        </h1>


        <div class="form">

            <input
                type="text"
                id="name"
                placeholder="Enter student name"
            >


            <input
                type="text"
                id="course"
                placeholder="Enter course"
            >


            <button onclick="addStudent()">
                Add Student
            </button>

        </div>


        <h2>
            Students
        </h2>


        <div id="studentList">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
